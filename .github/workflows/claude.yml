# Canonical @claude interactive-assistant workflow for the review-loop claude engine.
#
# Commit THIS (not /install-github-app's default) to the repo's DEFAULT BRANCH.
# Delta from the /install-github-app template: an AUTHOR-ASSOCIATION GATE on the
# trigger. The default fires on ANY comment containing the literal "@claude",
# which has two problems:
#   1. Security — any user who can comment could invoke a workflow that holds the
#      OAuth secret + write perms.
#   2. False triggers — a REVIEW BOT (Copilot, etc.) reviewing these very workflow
#      files quotes "@claude" in its comment ("this runs when anyone comments
#      @claude"), tripping the trigger; GitHub then gates the bot-triggered run as
#      action_required and spams the maintainer with "approve to run" prompts.
# Gating each event on a trusted author_association (OWNER/MEMBER/COLLABORATOR)
# fixes BOTH: bots and outside users don't carry a trusted association.
#
# DELIBERATE EXCEPTION (GitHub-App-driven review loop): our own write App
# `teisutis-agent[bot]` is ALSO admitted, by exact login match in the if: gate +
# `allowed_bots` on the action below. An App comment carries
# author_association=NONE, so without this the agent-issued `@claude review once`
# retrigger is silently dropped and the App can't drive its own review loop on
# this repo. This is NOT a general bot opening: it's ONE trusted first-party App
# whose key only the geras agent holds — a random review bot (Copilot[bot], etc.)
# still fails the login match, so the false-trigger concern in #2 above still
# holds. Must live on the DEFAULT branch to take effect.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
          || github.event.comment.user.login == 'teisutis-agent[bot]')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
          || github.event.comment.user.login == 'teisutis-agent[bot]')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)
          || github.event.review.user.login == 'teisutis-agent[bot]')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
          || github.event.issue.user.login == 'teisutis-agent[bot]'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        # Pinned like claude-code-review.yml (floating @v1 drifts, #1266). This
        # workflow answers the loop's `@claude review once` retrigger, so it runs
        # reviews too and needs the same model pins.
        uses: anthropics/claude-code-action@v1.0.244
        # Model pins — see engine-claude-onboarding.md § Choosing the review model.
        # The action's bundled Claude Code otherwise picks its own (stale) default.
        # No code-review plugin here — the session answers the @claude mention
        # itself; the env pins cover any subagent it launches by alias.
        env:
          ANTHROPIC_DEFAULT_OPUS_MODEL: claude-opus-5-5
          ANTHROPIC_DEFAULT_SONNET_MODEL: claude-sonnet-5-5
          ANTHROPIC_DEFAULT_HAIKU_MODEL: claude-haiku-4-5-20251001
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-sonnet-5-5
          # Allow our own write App to drive the review-loop retrigger. The
          # `@claude review once` bootstrap is posted by `teisutis-agent[bot]` in
          # agent-driven sessions; without this, claude-code-action's
          # non-human-actor guard aborts the run even after the job `if:` above
          # admits the bot. Scoped to our App only — NOT '*' — mirroring
          # claude-code-review.yml. Must live on the DEFAULT branch.
          allowed_bots: 'teisutis-agent[bot]'
          # Optional: lets Claude read CI results on PRs
          additional_permissions: |
            actions: read

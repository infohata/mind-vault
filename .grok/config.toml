# Project Grok Build config for mind-vault.
# Only [mcp_servers], [plugins], [permission] are read from project files
# (see https://docs.x.ai/build/settings/reference).
# Claude/Cursor layouts stay intact; Grok also scans .cursor/* via default compat cells.
# Native project agents/skills live under .grok/{agents,skills}/ (Cursor compat does
# NOT load .cursor/agents — verified via `grok inspect`).

[permission]
# Compact allow/deny string arrays (deny > ask > allow). Interactive SuperGrok stays ask;
# CI headless uses --yolo / --always-approve (deny still wins). The workflow also passes
# extra --deny Write(**) / Edit(**) / Bash(git push*) so review jobs stay read-only even
# when this project allow list includes Bash(git *) and Bash(gh *) for interactive use.
# See skills/review-loop/references/engine-grok.md + docs/guides/GROK_BUILD.md.
deny = [
  "Bash(git push*)",
]
allow = [
  "Read(**)",
  "Grep(**)",
  "Bash(git *)",
  "Bash(gh *)",
]
